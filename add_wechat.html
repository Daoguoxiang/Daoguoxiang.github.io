<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>添加微信</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(170deg,#0f4d24 0%,#1e7a3c 55%,#2c9b4f 100%);
    min-height:100vh;color:#fff;display:flex;align-items:center;justify-content:center;
    padding:20px;-webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%;max-width:400px;text-align:center;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
    border-radius:28px;padding:44px 30px 36px;
    box-shadow:0 12px 40px rgba(0,0,0,.25);
  }
  .title{font-size:26px;font-weight:800;letter-spacing:2px;}
  .sub{font-size:15px;opacity:.85;margin-top:10px;line-height:1.6;}
  .qr-box{background:#fff;border-radius:20px;padding:16px;margin:28px auto 0;width:260px;box-shadow:0 8px 24px rgba(0,0,0,.2);}
  .qr-box img{width:100%;border-radius:8px;display:block;}
  .hint{margin-top:20px;font-size:15px;opacity:.9;}
  .wechat{margin-top:8px;font-size:20px;font-weight:700;color:#f5c96a;letter-spacing:1px;}
</style>
</head>
<body>
<div class="card">
  <div class="title">✅ 信息已提交</div>
  <div class="sub">感谢您的填写，<br>请扫码添加微信，方便后续联系</div>
  <div class="qr-box">
    <img src="wechat_qr.png" alt="微信二维码">
  </div>
  <div class="hint">长按或截屏扫码添加</div>
  <div class="wechat">微信号：Huixin_Steven</div>
</div>
</body>
</html>
